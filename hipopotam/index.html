<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hipopotam – ruchy</title>
  <link rel="stylesheet" href="hipopotam.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 24px;
           font: 15px/1.4 system-ui, sans-serif; background: #f4f1ec; color: #3a3340; }
    .scena { display: flex; gap: 48px; align-items: flex-end; padding-top: 120px; }
  </style>
</head>
<body>
  <div class="scena">
    <!-- Klatki 548 × 676; szerokość ustawiasz na .hipopotam -->
    <button type="button" class="hipopotam" style="width: 220px" aria-label="Hipopotam – podskocz">
      <span class="hipopotam__cien" aria-hidden="true"></span>
      <span class="hipopotam__cialo" aria-hidden="true">
        <img class="hipopotam__klatka hipopotam__klatka--stoi" src="hipopotam-stoi.webp" alt="" width="548" height="676" draggable="false">
        <img class="hipopotam__klatka hipopotam__klatka--skok" src="hipopotam-skok.webp" alt="" width="548" height="676" draggable="false">
        <img class="hipopotam__klatka hipopotam__klatka--zaprasza" src="hipopotam-zaprasza.webp" alt="" width="548" height="676" draggable="false">
      </span>
    </button>
  </div>
  <p>Kliknij hipopotama, żeby podskoczył. <button type="button" id="zapros">Zaproś</button></p>
  <script src="hipopotam.js"></script>
  <script>
    var h = document.querySelector(".hipopotam");
    document.getElementById("zapros").addEventListener("click", function () { zapros(h); });
    // Powitanie raz po wejściu na stronę.
    window.addEventListener("load", function () { setTimeout(function () { zapros(h); }, 400); });
  </script>
</body>
</html>
