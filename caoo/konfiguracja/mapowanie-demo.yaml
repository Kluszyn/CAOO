# Źródło zapisanych odpowiedzi mapowania (#21) dla fikcyjnych pracowników demo.
# UWAGA: to NIE są odpowiedzi modelu językowego. Przygotowała je ręcznie osoba D jako
# odpowiedzi zapasowe dostawcy „zapisane” (spec #2: fallback do odpowiedzi zapisanych), żeby
# demo działało bez klucza API. W interfejsie mają tryb „zapisane”.
# Wymagania formalne (wykształcenie) celowo nie mają kompetencji → „nieprzypisane”.
# Po zmianie: uv run python -m caoo.mapowanie  (przelicza konfiguracja/mapowanie-zapisane.json)

K-001:
  zadanie:
    - [zarzadzanie-ludzmi, zarzadzanie-strategiczne, podejmowanie-decyzji]   # Kierowanie pracą urzędu
    - [rzetelnosc, podejmowanie-decyzji]                                     # Nadzór nad kontrolą weterynaryjną
    - [wspolpraca, komunikacja]                                              # Współpraca z inspekcją wojewódzką
  wymaganie:
    - [wykorzystywanie-wiedzy]                                               # Prawo wykonywania zawodu
    - [zarzadzanie-ludzmi]                                                   # 5 lat doświadczenia kierowniczego
