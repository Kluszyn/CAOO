# --- Rozbieżności materiałów (panel źródeł) ------------------------------------------------

rozbieznosci:
  - id: excel.dzielnik-sredniej
    nazwa: Zautomatyzowany Excel dzieli sumę ocen przez 5, także przy kryteriach dodatkowych
    opis: >-
      W „8. Arkusz B-wersja zautomatyzowana.xlsx” średnia to `listy i obliczenia!O13 = O11/O12`,
      gdzie O11 sumuje oceny obowiązkowe i dodatkowe (O2:O6, O8:O10), a dzielnik
      `O12 = 5+COUNTIF('Część I'!K19:Q21,"*")`. Kryteria dodatkowe są wpisywane w scalone komórki
      I19:O21, więc zakres K19:Q21 jest zawsze pusty i dzielnik wynosi 5. Przy 3 kryteriach
      dodatkowych Excel dzieli sumę 8 ocen przez 5. Aplikacja liczy według § 11.
    adnotacje:
      - kategoria: PRZEPIS
        doc_id: rozp-oceny-okresowe
        lokalizator: § 11 ust. 1 pkt 2
        strona: 3
        cytat_dosłowny: przez wyliczenie średniej arytmetycznej z ocen cząstkowych
      - kategoria: OBJAŚNIENIE_MATERIAŁU
        doc_id: arkusz-b-excel
        lokalizator: Część I!I18
        cytat_dosłowny: Tutaj możesz wybrać kryteria dodatkowe (maksymalnie 3)
      - kategoria: FUNKCJA_APLIKACJI
        uzasadnienie: >-
          Formuły nie ma w korpusie (ekstrakcja XLSX czyta wartości komórek), więc ich treść i adresy
          są opisane wyżej; sprawdza to test regresji test_regresja_excel_dzielnik_5.
        zatwierdził: osoba A (integrator)
    rozbieżność:
      opis: Excel liczy średnią z dzielnikiem 5, § 11 – średnią arytmetyczną wszystkich ocen cząstkowych.
      uzasadnienie: Logika oceny pochodzi z § 11, nie z Excela.
      zastosowana: 0
