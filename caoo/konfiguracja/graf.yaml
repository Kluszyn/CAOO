schemat:
  wersja: graf-v1
  obowiazuje_od: 2026-11-21
  typy_wezlow: [stanowisko, wymaganie, zadanie, kompetencja, kryterium, poziom, dowod, wynik, luka, dzialanie, rezultat]
  relacje:
    zawiera: [[stanowisko, wymaganie], [stanowisko, zadanie]]
    wspiera: [[wymaganie, zadanie]]
    odpowiada: [[zadanie, kompetencja]]
    ma_poziom_wymagany: [[kompetencja, poziom]]
    zestawiono_z: [[poziom, dowod], [poziom, wynik]]
    wskazuje_poziom: [[dowod, poziom], [wynik, poziom]]
    porownano_z_celem: [[poziom, luka]]
    proponuje_dzialanie: [[luka, dzialanie]]
    ma_rezultat: [[dzialanie, rezultat]]
    ma_dowod_poprawy: [[rezultat, dowod]]

wersja_katalogu: kompetencje-v1
# Wartość pomocnicza stosowana wyłącznie jako propozycja w grafie.
poziom_roboczy: 5
slowa_uzupelniajace:
  wykorzystywanie-wiedzy: [znajomość, certyfikat, opini, prawn, język, literatur, samokształc]
  zarzadzanie-ludzmi: [zarządzaniu, delegowan]
  organizacja-pracy: [organizacja pracy, priorytet]
# Samo uczestnictwo w szkoleniu lub spotkaniu z dawnego zalecenia nie świadczy o wystąpieniu.
slowa_pomijane_w_zaleceniach: [szkolen, spotkani]

