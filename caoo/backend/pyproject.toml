[project]
name = "caoo"
version = "0.1.0"
description = "Cyfrowy Asystent Ocen Okresowych (backend)."
requires-python = ">=3.11"
dependencies = [
    "caoo-core",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
]

[project.scripts]
caoo = "caoo.__main__:main"

[tool.uv.sources]
caoo-core = { path = "../../caoo-core", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caoo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Data Validation extension is not supported"]
